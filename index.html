<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: black;
    }
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    loop
    playsinline
    controls>
    
   <source src="https://raw.githubusercontent.com/websiteku-id/Love/main/Mylove.mp4" type="video/mp4">
    Browser kamu tidak mendukung video.
</video>

<script>
const video = document.getElementById("video");

// Coba mulai otomatis
video.play().catch(() => {
    console.log("Autoplay membutuhkan interaksi pengguna.");
});
</script>

</body>
</html>
